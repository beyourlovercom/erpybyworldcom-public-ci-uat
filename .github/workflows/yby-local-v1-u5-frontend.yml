name: YBY Local V1 U5 Frontend CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'resources/css/customer-os.css'
      - '.github/workflows/yby-local-v1-u5-frontend.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend build
        run: npm run build
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD

# Public UAT: trigger existing PR checks only; no deployment.
